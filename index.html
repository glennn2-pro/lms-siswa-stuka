  <script>
    const GAS_URL = "https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbzZvvSV8xQmURD6uZKFG8vIpR0G4UxRO-DtlcWnc6yi7H19VTwUC2HD5-h1YDNG2FBy/exec";

    // Progress Bar Animation
    let progress = 0;
    const bar = document.getElementById('progressBar');
    const percentText = document.getElementById('loadingPercentText');
    const statusText = document.getElementById('loadingStatusText');

    const statuses = [
      { at: 15, text: "Menyiapkan ruang kelas online..." },
      { at: 45, text: "Memuat modul & 14 mata pelajaran..." },
      { at: 80, text: "Mengautentikasi portal resmi..." },
      { at: 100, text: "Membuka LMS Siswa Teladan..." }
    ];

    const timer = setInterval(() => {
      progress += 5;
      if (progress > 100) progress = 100;

      if (bar) bar.style.width = progress + "%";
      if (percentText) percentText.innerText = progress + "%";

      const currentStatus = statuses.find(s => progress <= s.at);
      if (currentStatus && statusText) {
        statusText.innerText = currentStatus.text;
      }

      if (progress >= 100) {
        clearInterval(timer);
        setTimeout(() => {
          window.location.href = GAS_URL;
        }, 300);
      }
    }, 100);
  </script>
